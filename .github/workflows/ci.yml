name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Validate MCP Registry manifest
        run: npm run validate:manifest

      - name: Check English only (no Cyrillic in tracked files)
        run: node scripts/check-english.mjs

  container:
    name: Build image and run container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Proves the Dockerfile and scripts/smoke-container.sh before a release
      # publishes the image: build locally, then smoke the same steps an
      # operator runs after `docker pull`.
      - name: Build the gateway image
        run: docker build --tag opensmm-gateway:ci .

      - name: Report image size
        run: docker image ls opensmm-gateway:ci

      - name: Run the container smoke test
        env:
          SMOKE_IMAGE: opensmm-gateway:ci
        run: scripts/smoke-container.sh

  mcp-stdio:
    name: Build Dockerfile.mcp and smoke MCP over stdio
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The image is built for the check only and is never pushed.
      - name: Build the MCP stdio image
        run: docker build -f Dockerfile.mcp -t opensmm-mcp . && docker image ls opensmm-mcp

      - name: Smoke initialize and tools/list over stdio
        run: |
          set -euo pipefail
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          } | timeout 60 docker run -i --rm opensmm-mcp | tee mcp-stdio.out
          for id in 1 2; do
            line=$(grep -E "\"id\":$id[,}]" mcp-stdio.out || true)
            case "$line" in
              *'"result"'*) echo "id=$id: result OK" ;;
              *) echo "id=$id: no result in response" >&2; exit 1 ;;
            esac
          done

  # ZHC-1438: asks the release autopilot to run, only when every CI job above is
  # green and the last release tag is at least 60 minutes old; otherwise it ends
  # silently (the daily scheduled run picks the changes up). It never fails CI.
  # No secret = disabled. Rollback: revert the PR that added this job.
  release-trigger:
    name: release trigger
    needs: [test, container, mcp-stdio]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the release webhook
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
        with:
          script: |
            const url = process.env.RELEASE_WEBHOOK_URL;
            if (!url) return core.info('release webhook is not configured');
            const tags = await github.paginate(github.rest.repos.listTags, { ...context.repo, per_page: 100 });
            const version = (t) => t.name.slice(1).split('.').map(Number);
            const [last] = tags
              .filter((t) => /^v\d+\.\d+\.\d+$/.test(t.name))
              .sort((a, b) => {
                const [x, y] = [version(a), version(b)];
                return y[0] - x[0] || y[1] - x[1] || y[2] - x[2];
              });
            if (last) {
              const { data } = await github.rest.repos.getCommit({ ...context.repo, ref: last.commit.sha });
              const minutes = (Date.now() - Date.parse(data.commit.committer.date)) / 60000;
              if (minutes < 60) return core.info(`${last.name} is younger than 60 minutes`);
            }
            try {
              const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Idempotency-Key': `${context.repo.repo}-${context.sha}` },
                body: JSON.stringify({ repository: `${context.repo.owner}/${context.repo.repo}`, sha: context.sha }),
                signal: AbortSignal.timeout(20000),
              });
              if (!res.ok) return core.warning(`release webhook answered HTTP ${res.status}`);
              core.info('release webhook called');
            } catch {
              core.warning('release webhook is unreachable');
            }
