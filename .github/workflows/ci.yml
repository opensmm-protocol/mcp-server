name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Validate MCP Registry manifest
        run: npm run validate:manifest

  container:
    name: Build image and run container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Proves the Dockerfile and scripts/smoke-container.sh before a release
      # publishes the image: build locally, then smoke the same steps an
      # operator runs after `docker pull`.
      - name: Build the gateway image
        run: docker build --tag opensmm-gateway:ci .

      - name: Run the container smoke test
        env:
          SMOKE_IMAGE: opensmm-gateway:ci
        run: scripts/smoke-container.sh
