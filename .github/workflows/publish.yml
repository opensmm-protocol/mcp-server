name: Publish gateway image

# Builds the gateway image to the GitHub Container Registry on merges to
# `main` and on v* tags.
#
# The image is internal only: ghcr.io/opensmm-protocol/gateway stays private
# (decision 2026-11-16, ZHC-470), there is no public pull path and nothing
# here requires one. External operators install a node from the sources —
# README, «Run a node from source in 5 minutes». The smoke test therefore runs
# against the image this job pushed, pulled back with the job's own registry
# credentials, never anonymously.
#
# No new secrets: the workflow uses the built-in GITHUB_TOKEN only, inside the
# free ghcr quota.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gateway

jobs:
  image:
    name: Build, push and smoke the image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest tracks the default branch; a v* tag adds semver tags.
      # Every build also gets a commit tag, so an exact revision stays pullable.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Build and push linux/amd64
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A plain single-arch manifest keeps the (private) pull simple.
          provenance: false
          sbom: false

      # The package is private, so the only pull path is this job's own
      # credentials. An anonymous pull is not a goal and must not be attempted:
      # buildx cannot push and load one build in the same step, so the pushed
      # digest is pulled back here and that exact artifact is what we smoke.
      - name: Smoke the pushed image
        env:
          SMOKE_IMAGE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${SMOKE_IMAGE}"
          scripts/smoke-container.sh

      - name: Record the published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published image"
            echo
            echo "Private package: pulls require registry credentials."
            echo
            echo '```'
            echo "${TAGS}"
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
