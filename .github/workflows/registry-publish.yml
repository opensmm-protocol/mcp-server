name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned deliberately: the MCP Registry docs forbid `releases/latest` for a
  # binary that runs with `id-token: write`. Update together with the cosign
  # identity below.
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    environment: release
    outputs:
      published: ${{ steps.release.outputs.publish == 'true' && steps.token.outputs.present == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches the package version
        id: release
        run: node scripts/check-release-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Check for NPM_TOKEN
        id: token
        if: steps.release.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::notice title=npm publish skipped::NPM_TOKEN is not configured; skipping npm publish instead of failing the run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this version is already on npm
        id: existing
        if: steps.release.outputs.publish == 'true' && steps.token.outputs.present == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@opensmm/mcp-server@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=npm publish skipped::@opensmm/mcp-server@${VERSION} is already on npm; continuing to the registry."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.release.outputs.publish == 'true' && steps.token.outputs.present == 'true' && steps.existing.outputs.exists != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publishes the MCP Bundle as a GitHub Release asset and then the registry
  # entry that points to it. Independent of npm. A published asset or version is
  # never replaced: a fix is a new version.
  registry:
    name: Publish to the MCP Registry
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify release tag matches the package version
        id: release
        run: node scripts/check-release-version.mjs

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm ci

      - name: Build the MCP bundle
        if: steps.release.outputs.publish == 'true'
        run: npm run build:mcpb

      - name: Attach the bundle to the GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          asset="opensmm-mcp-server-${VERSION}.mcpb"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # The second `view` covers a release created by someone else meanwhile.
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes ||
              gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          if grep -Fxq "$asset" <<<"$assets"; then
            echo "::notice title=Release asset reused::${asset} is already attached to ${GITHUB_REF_NAME}; it is not replaced."
          else
            gh release upload "$GITHUB_REF_NAME" "build/${asset}"
          fi

      # No token: this is the download every registry user gets.
      - name: Download the asset anonymously and smoke it
        if: steps.release.outputs.publish == 'true'
        run: |
          set -euo pipefail
          url="$(node -p 'require("./server.json").packages[0].identifier')"
          file="${RUNNER_TEMP}/$(basename "$url")"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors --output "$file" "$url"
          node scripts/smoke-mcpb.mjs "$file"
          node scripts/render-registry-manifest.mjs "$file" "${RUNNER_TEMP}/server.publish.json"

      - name: Check whether this version is already listed
        id: listed
        if: steps.release.outputs.publish == 'true'
        run: |
          if node scripts/check-registry-entry.mjs "${RUNNER_TEMP}/server.publish.json"; then
            echo "listed=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=MCP Registry publish skipped::this version is already listed with this identifier and hash."
          else
            echo "listed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: steps.release.outputs.publish == 'true' && steps.listed.outputs.listed != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: steps.release.outputs.publish == 'true' && steps.listed.outputs.listed != 'true'
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher --version

      - name: Log in with GitHub OIDC
        if: steps.release.outputs.publish == 'true' && steps.listed.outputs.listed != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish the manifest with the file hash
        if: steps.release.outputs.publish == 'true' && steps.listed.outputs.listed != 'true'
        run: ./mcp-publisher publish "${RUNNER_TEMP}/server.publish.json"

      - name: Verify the registry lists this version
        if: steps.release.outputs.publish == 'true'
        run: node scripts/check-registry-entry.mjs "${RUNNER_TEMP}/server.publish.json" 12
