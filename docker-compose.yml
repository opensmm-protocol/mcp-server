# Reference deployment for a self-hosted OpenSMM gateway (docs/DEPLOY.md).
# One process serves both bindings: REST /v0 and MCP /mcp on port 8080.
# State lives on the named volume (orders, metrics, node registrations).
services:
  gateway:
    # Source-only build until the prebuilt image is public (ZHC-370).
    # Once public, replace `build: .` with:
    # image: ghcr.io/opensmm-protocol/gateway:latest
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      # Live execution provider (reseller REST v1) — or use an .env file
      # OPENSMM_REST_V1_BASE_URL: https://provider.example/api/v1
      # OPENSMM_REST_V1_API_KEY: change-me
      # OPENSMM_PROVIDER_PAYOUT: 0xYourUsdcBaseAddress
    volumes:
      - opensmm-data:/data
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  opensmm-data:
